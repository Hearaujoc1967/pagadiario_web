{% extends "base_pw.html" %}
{% set page_title = titulo %}
{% block title %}{{ titulo }} - Pagadiario{% endblock %}
{% block content %}
<form method="POST">
<div class="card mb-5">
  <div class="card-header border-0 pt-5"><h3 class="card-title flex-column align-items-start"><span class="fw-bold fs-3">Datos del cobrador</span><span class="text-muted fs-7 mt-1">Los campos con * son obligatorios</span></h3></div>
  <div class="card-body pt-2"><div class="row g-5">
    <div class="col-md-6"><label class="form-label fw-semibold required">Nombre del cobrador</label><input type="text" class="form-control form-control-solid" name="nombre" value="{{ cobrador.nombre if cobrador else '' }}" required placeholder="Ej: Pedro Bertel"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Usuario del sistema</label>
      <select class="form-select form-select-solid" id="sel_usuario" name="id_usuario"><option value="">-- Sin asignar --</option>{% for u in usuarios %}<option value="{{ u.id }}" {% if cobrador and cobrador.id_usuario == u.id %}selected{% endif %}>{{ u.nombre }} ({{ u.login }})</option>{% endfor %}</select>
      <div class="text-muted fs-8 mt-2">Opcional. Solo si quieres vincularlo a un usuario.</div></div>
  </div></div>
</div>
<div class="d-flex justify-content-end gap-3 mb-10">
  <a href="{{ url_for('cobradores') }}" class="btn btn-light">Cancelar</a>
  <button type="submit" class="btn btn-primary">Guardar cobrador</button>
</div>
</form>
{% endblock %}
{% block scripts %}
<script>$('#sel_usuario').select2({width:'100%',minimumResultsForSearch:Infinity});</script>
{% endblock %}
