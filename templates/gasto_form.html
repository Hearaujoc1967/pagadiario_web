{% extends "base_pw.html" %}
{% set page_title = titulo %}
{% block title %}{{ titulo }} - Pagadiario{% endblock %}
{% block content %}
<form method="POST" id="formGasto">
<div class="card mb-5">
  <div class="card-header border-0 pt-5"><h3 class="card-title flex-column align-items-start"><span class="fw-bold fs-3">Datos del gasto</span><span class="text-muted fs-7 mt-1">Los campos con * son obligatorios</span></h3></div>
  <div class="card-body pt-2"><div class="row g-5">
    <div class="col-md-4"><label class="form-label fw-semibold">Cobrador</label>
      <select class="form-select form-select-solid" id="sel_cob" name="id_cobrador"><option value="">-- Sin asignar --</option>{% for c in cobradores %}<option value="{{ c.id }}" {% if gasto and gasto.id_cobrador == c.id %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label fw-semibold required">Fecha</label><input type="date" class="form-control form-control-solid" name="fecha" value="{{ gasto.fecha if gasto else fecha_hoy }}" required></div>
    <div class="col-md-4"><label class="form-label fw-semibold">Total (automático)</label><input type="text" class="form-control form-control-solid fw-bold" id="totalGasto" readonly value="$0"></div>
  </div></div>
</div>
<div class="card mb-5">
  <div class="card-header border-0 pt-5"><h3 class="card-title fw-bold fs-3">Detalle de ítems</h3><div class="card-toolbar"><button type="button" class="btn btn-sm btn-light-primary" id="btn_add">Añadir ítem</button></div></div>
  <div class="card-body pt-2" id="cuerpoDetalle"></div>
</div>
<div class="d-flex justify-content-end gap-3 mb-10">
  <a href="{{ url_for('gastos') }}" class="btn btn-light">Cancelar</a>
  <button type="submit" class="btn btn-primary">Guardar gasto</button>
</div>
</form>
{% endblock %}
{% block scripts %}
<script>
var tiposGasto={{ tipos|tojson }};
function calcularTotal(){var t=0;$('.monto').each(function(){t+=parseFloat(this.value)||0});$('#totalGasto').val('$'+Math.round(t).toLocaleString('es-CO'))}
function renum(){$('#cuerpoDetalle .item').each(function(i){$(this).find('.n_item').text('Ítem '+(i+1))})}
function agregarFila(d){
 var o='<option value="">-- Seleccionar --</option>';
 tiposGasto.forEach(function(t){o+='<option value="'+t.id+'">'+t.descripcion+'</option>'});
 var ico='<i class="ki-duotone ki-trash fs-3"><span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span><span class="path5"></span></i>';
 var $f=$('<div class="item border border-dashed rounded p-4 mb-4"><div class="d-flex justify-content-between align-items-center mb-3"><span class="fw-bold text-gray-700 n_item"></span><button type="button" class="btn btn-icon btn-sm btn-light-danger btn-del" title="Quitar">'+ico+'</button></div><div class="row g-3"><div class="col-12"><label class="form-label fw-semibold required">Tipo</label><select class="form-select form-select-solid" name="tipo_gasto[]" required>'+o+'</select></div><div class="col-12"><label class="form-label fw-semibold">Descripción</label><input type="text" class="form-control form-control-solid" name="descripcion[]"></div><div class="col-5"><label class="form-label fw-semibold required">Cantidad</label><input type="number" class="form-control form-control-solid cantidad" name="cantidad[]" min="1" value="1" required></div><div class="col-7"><label class="form-label fw-semibold required">Monto ($)</label><input type="number" step="0.01" class="form-control form-control-solid monto" name="monto[]" required></div></div></div>');
 if(d){$f.find('select').val(d.id_tipo_gasto);$f.find('[name="descripcion[]"]').val(d.descripcion||'');$f.find('.cantidad').val(d.cantidad||1);$f.find('.monto').val(d.monto)}
 $('#cuerpoDetalle').append($f);
 $f.find('select').select2({width:'100%',minimumResultsForSearch:Infinity});
 renum();calcularTotal();
}
$('#sel_cob').select2({width:'100%',minimumResultsForSearch:Infinity});
$('#btn_add').on('click',function(){agregarFila()});
$(document).on('click','.btn-del',function(){$(this).closest('.item').remove();renum();calcularTotal()});
$(document).on('input','.monto',calcularTotal);
{% if gasto and gasto.detalles %}
var det={{ gasto.detalles|tojson }};
det.forEach(function(d){agregarFila(d)});
{% else %}
agregarFila();
{% endif %}
</script>
{% endblock %}
