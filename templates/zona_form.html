{% extends "base_pw.html" %}
{% set page_title = titulo %}
{% block title %}{{ titulo }} - Pagadiario{% endblock %}
{% block content %}
<form method="POST">
<div class="card mb-5">
  <div class="card-header border-0 pt-5"><h3 class="card-title flex-column align-items-start"><span class="fw-bold fs-3">Datos de la zona</span><span class="text-muted fs-7 mt-1">Los campos con * son obligatorios</span></h3></div>
  <div class="card-body pt-2"><div class="row g-5">
    <div class="col-md-6"><label class="form-label fw-semibold required">Nombre de la zona</label><input type="text" class="form-control form-control-solid" name="zona" value="{{ zona.zona if zona else '' }}" required placeholder="Ej: Zona Centro"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Dirección</label><input type="text" class="form-control form-control-solid" name="direccion" value="{{ zona.direccion if zona else '' }}" placeholder="Ej: Centro de la ciudad"></div>
  </div></div>
</div>
<div class="d-flex justify-content-end gap-3 mb-10">
  <a href="{{ url_for('zonas') }}" class="btn btn-light">Cancelar</a>
  <button type="submit" class="btn btn-primary">Guardar zona</button>
</div>
</form>
{% endblock %}
