<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <title>{% block title %}Pagadiario{% endblock %}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
    <link href="{{ url_for('static', filename='metronic/plugins/global/plugins.bundle.css') }}" rel="stylesheet" type="text/css" />
    <link href="{{ url_for('static', filename='metronic/css/style.bundle.css') }}" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block styles %}{% endblock %}



<style id="fix-dropdowns-final">
    /* Hace que los dropdowns tengan fondo sólido y no se aplasten */
    .menu.menu-sub-dropdown {
        background-color: var(--bs-body-bg) !important;
        box-shadow: 0px 0px 30px 0px rgba(0, 0, 0, 0.15) !important;
        border: 1px solid var(--bs-border-color) !important;
        border-radius: 0.625rem !important;
        min-width: 200px !important;
    }
    [data-bs-theme="dark"] .menu.menu-sub-dropdown {
        background-color: #1e1e2d !important;
        border-color: #2b2b40 !important;
    }
    /* Asegura que los textos de los menús no se corten */
    .menu.menu-sub-dropdown .menu-item .menu-link {
        white-space: normal !important;
        padding-left: 15px !important;
        padding-right: 15px !important;
    }
    /* Alinear menú de temas a la derecha */
</style>

</head>
<body id="kt_body" class="header-fixed header-tablet-and-mobile-fixed aside-fixed aside-secondary-enabled">
    <script>
        var defaultThemeMode = "light"; var themeMode;
        if ( document.documentElement ) {
            if ( document.documentElement.hasAttribute("data-bs-theme-mode")) { themeMode = document.documentElement.getAttribute("data-bs-theme-mode"); } 
            else { if ( localStorage.getItem("data-bs-theme") !== null ) { themeMode = localStorage.getItem("data-bs-theme"); } else { themeMode = defaultThemeMode; } }
            if (themeMode === "system") { themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
            document.documentElement.setAttribute("data-bs-theme", themeMode);
        }
    </script>

    <div class="d-flex flex-column flex-root">
        <div class="page d-flex flex-row flex-column-fluid">
            {% include '_sidebar.html' %}
            
            <div class="wrapper d-flex flex-column flex-row-fluid" id="kt_wrapper">
                {% include '_header.html' %}

                <div class="content d-flex flex-column flex-column-fluid" id="kt_content">
                    <div class="container-xxl" id="kt_content_container">
                        {% block body %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>var hostUrl = "{{ url_for('static', filename='metronic/') }}";</script>
    <script src="{{ url_for('static', filename='metronic/plugins/global/plugins.bundle.js') }}"></script>
    </div>


<!-- MODAL NUEVO CLIENTE -->
<div class="modal fade" id="modal_nuevo_cliente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary">
                <h3 class="modal-title fw-bold text-white"><i class="fas fa-user-plus me-2 fs-2"></i>Nuevo Cliente</h3>
                <div class="btn btn-sm btn-icon btn-active-color-white text-white" data-bs-dismiss="modal">
                    <i class="ki-duotone ki-cross fs-1"><span class="path1"></span><span class="path2"></span></i>
                </div>
            </div>
            <div class="modal-body" id="form-cliente-container">
                <div class="text-center py-10"><span class="spinner-border text-primary"></span></div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL NUEVO PRÉSTAMO -->
<div class="modal fade" id="modal_nuevo_prestamo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary">
                <h3 class="modal-title fw-bold text-white"><i class="fas fa-plus-circle me-2 fs-2"></i>Nuevo Préstamo</h3>
                <div class="btn btn-sm btn-icon btn-active-color-white text-white" data-bs-dismiss="modal">
                    <i class="ki-duotone ki-cross fs-1"><span class="path1"></span><span class="path2"></span></i>
                </div>
            </div>
            <div class="modal-body" id="form-prestamo-container">
                <div class="text-center py-10"><span class="spinner-border text-primary"></span></div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='metronic/js/scripts.bundle.js') }}"></script>
    <script src="{{ url_for('static', filename='metronic/js/widgets.bundle.js') }}"></script>
    {% block scripts %}{% endblock %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (typeof KTMenu !== 'undefined') {
            KTMenu.createInstances();
        }
    });
    // Cierra sidebar al hacer clic en enlaces del header en móvil
    document.querySelectorAll('#kt_header_container a, #kt_header_container [data-kt-menu-trigger]').forEach(function(el) {
        el.addEventListener('click', function() {
            var aside = document.getElementById('kt_aside');
            if (aside && aside.classList.contains('aside-on')) {
                var toggle = document.getElementById('kt_aside_mobile_toggle');
                if (toggle) { toggle.click(); }
            }
        });
    });
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('[data-fetch-url]').forEach(function(btn) {
        var loaded = false;
        btn.addEventListener('click', function() {
            if (loaded) return;
            var modal = document.querySelector(btn.dataset.bsTarget);
            if (!modal) return;
            var target = modal.querySelector('.modal-body');
            if (!target) return;
            var url = btn.dataset.fetchUrl + (btn.dataset.fetchUrl.indexOf('?') === -1 ? '?' : '&') + 'partial=1';
            fetch(url, { credentials: 'same-origin' })
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function(html) {
                    target.innerHTML = html;
                    loaded = true;
                    if (window.KTMenu && KTMenu.createInstances) KTMenu.createInstances();
                })
                .catch(function(e) {
                    target.innerHTML = '<div class="alert alert-danger m-3">Error al cargar: ' + e.message + '</div>';
                });
        });
    });
});
</script>
<style>
    /* Mantener el header visible por encima del modal */
    #kt_header { z-index: 1060 !important; position: relative; }
    .modal-backdrop { z-index: 1050 !important; }
    .modal { z-index: 1055 !important; }
    /* Ajustar el modal para que no quede pegado arriba */
    .modal-dialog { margin-top: 80px !important; }
    /* Alinear menú de temas a la derecha */
</style>
</body>
</html>
