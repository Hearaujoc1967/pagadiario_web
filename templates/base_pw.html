<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}PagaDiario{% endblock %}</title>
    <link href="{{ url_for('static', filename='metronic/plugins/plugins.bundle.css') }}" rel="stylesheet" type="text/css" />
    <link href="{{ url_for('static', filename='metronic/css/style.bundle.css') }}" rel="stylesheet" type="text/css" />
    {% block head %}{% endblock %}
</head>
<body id="kt_body" class="header-fixed header-tablet-and-mobile-fixed aside-fixed aside-secondary-enabled">
<script>(function(){var m="light";try{m=localStorage.getItem("data-bs-theme")||"light";}catch(e){}if(m==="system")m=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-bs-theme",m);})();</script>
<div class="d-flex flex-column flex-root">
  <div class="page d-flex flex-row flex-column-fluid">
    {% include 'includes/sidebar_pw.html' %}
    <div class="wrapper d-flex flex-column flex-row-fluid" id="kt_wrapper">
      {% include 'includes/navbar_pw.html' %}
      <div class="content d-flex flex-column flex-column-fluid" id="kt_content">
        <div class="container-fluid" id="kt_content_container">
          {% block content %}{% endblock %}
        </div>
      </div>
      <div class="footer py-4 d-flex flex-lg-column" id="kt_footer">
        <div class="container-fluid text-gray-600 fs-7">PagaDiario</div>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='metronic/plugins/plugins.bundle.js') }}"></script>
<script src="{{ url_for('static', filename='metronic/js/scripts.bundle.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
