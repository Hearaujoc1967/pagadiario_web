{% extends "base_pw.html" %}
{% set page_title = titulo %}
{% block title %}{{ titulo }} - Pagadiario{% endblock %}
{% block content %}
<div class="card border-0 overflow-hidden mb-5" style="background:linear-gradient(160deg,#e83e8c,#9c1f5c)">
  <div class="card-body p-5 text-center py-15">
    <i class="ki-duotone ki-note-2 text-white mb-4" style="font-size:4rem"><span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span></i>
    <div class="text-white fs-2 fw-bold mb-2">Módulo de {{ titulo }}</div>
    <div class="text-white fs-6 opacity-75 mb-6">Este módulo está en construcción. Pronto estará disponible.</div>
    <a href="{{ url_for('dashboard') }}" class="btn btn-light fw-bold">Volver al Dashboard</a>
  </div>
</div>
{% endblock %}
